name: Sync to Gitee

# 触发条件：当推送到 main 分支时触发
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码（获取完整 Git 历史）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 镜像同步到 Gitee
      - name: Mirror to Gitee
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          # 替换为你的 Gitee 仓库 SSH 地址
          target_repo_url: git@gitee.com:zaxys916/djangoStore.git
          # 引用上一步配置的 SSH 私钥 Secret
          ssh_private_key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
