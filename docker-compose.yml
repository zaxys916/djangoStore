version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: django_mysql
    restart: always
    environment:
      MYSQL_DATABASE: django_store
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: django_redis
    restart: always
    command: redis-server
    ports:
      - "6379:6379"
    networks:
      - app_network

  django:
    build:
      context: ./backend
    image: django-store:latest
    container_name: django_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=django_store
      - DB_USER=root
      - DB_PASSWORD=123456
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
    depends_on:
      - mysql
      - redis
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge