services:
  mysql:
    image: mysql:latest
    container_name: django_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - app_network

  redis:
    image: redis:alpine
    container_name: django_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app_network

  django:
    build: ./backend
    image: django-store:latest
    container_name: django_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./:/app          # 挂载 apps 目录（开发热更新）
      - ./logs:/app/logs          # 日志
      - ./static:/app/static      # 静态文件
      - ./media:/app/media        # 媒体文件
    depends_on:
      - mysql:
        condition: service_healthy
      - redis
    networks:
      - app_network

  frontend:
    build: ./front_end_pc
    image: front_end_pc:latest
    container_name: front_end_pc
    restart: always
    ports:
      - "8080:8000"
    networks:
      - app_network

  nginx:
    build: ./nginx
    image: my-nginx
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
    depends_on:
      - django
      - frontend
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge