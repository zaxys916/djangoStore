version: '3.8'

services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:latest                      # 你已有的
    container_name: django_mysql
    restart: always
    environment:
      MYSQL_DATABASE: djangoStore
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis 缓存 ==========
  redis:
    image: docker.1ms.run/redis:latest       # 你已有的
    container_name: django_redis
    restart: always
    command: redis-server --requirepass redis_password_789
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password_789", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Django 后端 ==========
  django:
    build: .
    image: django-store:latest
    container_name: django_app
    restart: always
    environment:
      - DEBUG=True
      - SECRET_KEY=test-key
      - DB_HOST=mysql
      - DB_NAME=djangoStore
      - DB_USER=root
      - DB_PASSWORD=123456
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis_password_789
      - ALLOWED_HOSTS=*
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ========== 前端 ==========
  frontend:
    build: ./front_end_pc
    image: front_end_pc:latest
    container_name: front_end_pc
    restart: always
    networks:
      - app_network

  # ========== Nginx ==========
  nginx:
    image: docker.1ms.run/nginx:latest       # 你已有的
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django
      - frontend
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge