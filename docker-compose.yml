services:
  mysql:
    image: mysql:latest
    container_name: django_mysql
    restart: always
    environment:
      MYSQL_DATABASE: djangoStore
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network

  redis:
    image: redis:alpine
    container_name: django_redis
    restart: always
    command: redis-server --requirepass redis_password_789
    ports:
      - "6379:6379"
    networks:
      - app_network

  django:
    build: .
    image: django-store:latest
    container_name: django_app
    restart: always
    ports:
      - "8000:8000" 
    env_file:
      - .env 
    environment:
      - DEBUG=True
      - SECRET_KEY=test-key
      - DB_HOST=mysql
      - DB_NAME=djangoStore
      - DB_USER=root
      - DB_PASSWORD=123456
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis_password_789
      - ALLOWED_HOSTS=*
    depends_on:
      - mysql
      - redis
    networks:
      - app_network

  frontend:
    build: ./front_end_pc
    image: front_end_pc:latest
    container_name: front_end_pc
    restart: always
    networks:
      - app_network

  nginx:
    build: ./nginx
    image: my-nginx
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
    depends_on:
      - django
      - frontend
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge