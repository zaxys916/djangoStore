server {
    listen 80;

    # 前端静态页面（默认路由）
    location / {
        proxy_pass http://front_end_pc:8000;
    }

    # Django API 路由（按 apps/users/urls.py 和 apps/verifications/urls.py 的路径）
    location /register/ {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /login/ {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /usernames/ {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
    }

    location /mobiles/ {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
    }

    location /image_codes/ {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
    }

    location /sms_code/ {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
    }
}
