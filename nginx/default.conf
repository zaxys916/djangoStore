server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://front_end_pc:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://django_app:8000;
    }
}