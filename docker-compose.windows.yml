version: '3.8'

# ==================== Windows 端本地开发配置 ====================
# 适用环境：Windows 10/11 + Docker Desktop (WSL2 后端)
# 启动命令：docker-compose -f docker-compose.windows.yml up --build
# 访问地址：http://localhost

services:
  mysql:
    image: mysql:8.0
    container_name: django_mysql
    restart: always
    environment:
      MYSQL_DATABASE: django_store
      MYSQL_ROOT_PASSWORD: 123456
      # Windows 下 MySQL 字符集设置
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"  # 暴露给宿主机，方便 Windows 上用 Navicat 等工具连接
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: django_redis
    restart: always
    command: redis-server
    ports:
      - "6379:6379"  # 暴露给宿主机，方便 Windows 上用 RedisDesktopManager 连接
    networks:
      - app_network

  django:
    build:
      context: ./backend
      dockerfile: dockerfile
    image: django-store:latest
    container_name: django_app
    restart: always
    ports:
      - "8000:8000"  # 暴露给宿主机，方便 Windows 上直接访问 Django
    environment:
      - DEBUG=True
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=django_store
      - DB_USER=root
      - DB_PASSWORD=123456
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      # Windows 下挂载源码，支持热重载开发
      - ./backend:/app
    depends_on:
      - mysql
      - redis
    networks:
      - app_network

  front_end_pc:
    build:
      context: ./front_end_pc
      dockerfile: dockerfile
    container_name: front_end_pc
    restart: always
    ports:
      - "8001:8000"  # 暴露给宿主机，方便 Windows 上直接访问前端
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
    volumes:
      # Windows 下挂载 nginx 配置
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django
      - front_end_pc
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
